# PR + main gate: the full local loop (test → typecheck → build) plus the two
# publish-shaped checks — a pack dry-run so a broken files/bin manifest fails
# here instead of on release day, and a --help smoke of the built binary.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned for the same reason release.yml is, and to the same versions:
      # this job runs the pack dry-run that stands in for the real publish, so a
      # toolchain that drifts from release.yml's makes the rehearsal worthless.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Built binary smoke (--help)
        run: node dist/index.js --help

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Matches release.yml, so the dry-run exercises the same Node/npm
          # the real publish uses.
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Publish dry-run (validates the pack, no token needed)
        run: npm publish --dry-run --access public
