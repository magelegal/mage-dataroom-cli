# Tag → npm. Push a tag like v0.2.0 (matching package.json's version) and this
# re-runs the full verify loop, then publishes via npm TRUSTED PUBLISHING:
# npm trusts this workflow's OIDC identity directly — no token exists anywhere,
# and provenance is attached explicitly (v0.2.1 showed the trusted-publisher default does NOT add it on its own).
# Idempotent: a tag whose version is already on npm verifies, then green-skips the publish.
#
# The npm-side half of the trust lives in the package's settings on npmjs.com
# (Trusted Publisher: GitHub Actions · magelegal/mage-dataroom-cli ·
# release.yml). Requirements: npm CLI ≥ 11.5.1 (the runner's Node bundles an
# older npm, hence the pinned upgrade step) and a GitHub-hosted runner. One npm quirk: a BRAND-NEW
# package can't be born through trusted publishing — the first-ever version is
# published manually; every version after that lands through this workflow.
name: Release

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # Every `uses:` here is pinned to a commit SHA, not a tag. A tag is a
      # pointer its publisher can move, and this job publishes the package to
      # npm with an OIDC identity npm trusts — a moved tag lands inside that
      # trust. The `# vX.Y.Z` comment keeps the SHA readable and lets
      # Dependabot's github-actions ecosystem bump both together.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # An exact version, not `latest`: `latest` resolves at run time, so
          # the toolchain that builds a published artifact is whatever shipped
          # that morning and no two releases are reproducible.
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Tag must match package.json version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Pinned exactly, not @latest and not @11. v0.4.0's first release run died
      # here when npm@12 dropped support for the job's Node version, so the
      # major was pinned; a range still resolves at run time, which means the
      # tool that uploads the package is whatever the registry served that
      # morning. npm 11 satisfies trusted publishing (≥ 11.5.1) and this version
      # is ours to bump deliberately, not npm's to change under us.
      - name: Upgrade npm (trusted publishing needs ≥ 11.5.1)
        run: |
          npm install -g npm@11.19.0
          npm --version

      - name: Publish (OIDC trusted publishing — tokenless)
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "@magelegal/cli@${VERSION}" version >/dev/null 2>&1; then
            echo "::notice::@magelegal/cli@${VERSION} is already on npm — nothing to publish."
            exit 0
          fi
          npm publish --provenance --access public
